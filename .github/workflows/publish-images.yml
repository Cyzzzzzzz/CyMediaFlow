name: Publish NAS container images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "compose.yaml"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

# The workflow-local GITHUB_TOKEN may only read repository contents and publish
# this repository's images. It has no broader repository write access.
permissions:
  contents: read
  packages: write

jobs:
  validate-backend:
    name: Validate backend on Python 3.10
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Python 3.10 checks
        working-directory: backend
        run: python -m ruff check app tests && python -m pytest -q

  publish:
    name: Publish ${{ matrix.service }} image
    needs: validate-backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: ghcr.io/cyzzzzzzz/cymediaflow-backend
          - service: frontend
            context: ./frontend
            image: ghcr.io/cyzzzzzzz/cymediaflow-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ matrix.image }}:main
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
