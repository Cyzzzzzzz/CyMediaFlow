name: Export NAS image archive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public GitHub Release tag used for the image archive
        required: true
        type: string

# This workflow can read the already-published GHCR packages and publish one
# public release asset. It cannot modify repository source code.
permissions:
  contents: write
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      BACKEND_REPOSITORY: ghcr.io/cyzzzzzzz/cymediaflow-backend
      FRONTEND_REPOSITORY: ghcr.io/cyzzzzzzz/cymediaflow-frontend
      ARCHIVE_NAME: cymediaflow-nas-images.tar.gz
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images for this exact source revision
        run: |
          BACKEND_SHA_IMAGE="$BACKEND_REPOSITORY:sha-$GITHUB_SHA"
          FRONTEND_SHA_IMAGE="$FRONTEND_REPOSITORY:sha-$GITHUB_SHA"
          docker pull "$BACKEND_SHA_IMAGE"
          docker pull "$FRONTEND_SHA_IMAGE"
          docker tag "$BACKEND_SHA_IMAGE" "$BACKEND_REPOSITORY:main"
          docker tag "$FRONTEND_SHA_IMAGE" "$FRONTEND_REPOSITORY:main"

      - name: Create compressed Docker image archive
        run: |
          BACKEND_SHA_IMAGE="$BACKEND_REPOSITORY:sha-$GITHUB_SHA"
          FRONTEND_SHA_IMAGE="$FRONTEND_REPOSITORY:sha-$GITHUB_SHA"
          docker save \
            "$BACKEND_REPOSITORY:main" \
            "$FRONTEND_REPOSITORY:main" \
            "$BACKEND_SHA_IMAGE" \
            "$FRONTEND_SHA_IMAGE" \
            | gzip --best > "$ARCHIVE_NAME"
          sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$ARCHIVE_NAME.version"

      - name: Publish archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "CyMediaFlow NAS image archive"
          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE_NAME" \
            "$ARCHIVE_NAME.sha256" \
            "$ARCHIVE_NAME.version" \
            --clobber
